<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DexoClient - Портал</title>
    <!-- Подключаем красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        
        body { 
            background-color: #050505; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                radial-gradient(circle at 10% 20%, rgba(255, 0, 0, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 0, 0.1), transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
        }

        header {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            padding: 15px 40px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 2px solid #ff0000; 
            box-shadow: 0 5px 25px rgba(255, 0, 0, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        .header-logo-icon { height: 45px; filter: drop-shadow(0 0 10px rgba(255,0,0,0.8)); transition: transform 0.3s; }
        .header-logo-icon:hover { transform: scale(1.1); }
        .header-logo-text { height: 25px; filter: drop-shadow(0 0 5px rgba(255,0,0,0.5)); }

        nav { display: flex; gap: 10px; }
        
        /* Красивые кнопки */
        nav button {
            background: transparent; 
            color: #fff; 
            border: 1px solid rgba(255, 0, 0, 0.5);
            padding: 10px 20px; 
            border-radius: 8px;
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
        }
        nav button:hover, nav button.active { 
            background: #ff0000; 
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); 
            color: #000; 
            transform: translateY(-2px);
        }

        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 50px 20px; }
        
        .container {
            width: 100%; max-width: 800px; background: rgba(17, 17, 17, 0.95);
            border: 1px solid rgba(255, 0, 0, 0.2); border-radius: 20px; padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.05);
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .auth-container { max-width: 500px; }
        .hidden { display: none !important; }
        
        h2 { 
            text-align: center; margin-bottom: 30px; 
            color: #fff; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            font-weight: 900;
        }
        h3 { color: #ff0000; margin-bottom: 15px; font-weight: 800; }
        
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; margin-bottom: 10px; color: #aaa; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333; border-radius: 10px; color: #fff; outline: none; 
            transition: all 0.3s ease; font-size: 15px;
        }
        .form-group input:focus, .form-group textarea:focus { 
            border-color: #ff0000; 
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3); 
            background: rgba(20, 0, 0, 0.8);
        }
        
        /* Кнопка действия (основная) */
        .btn-primary {
            width: 100%; padding: 16px; 
            background: linear-gradient(135deg, #ff0000, #990000); 
            color: #fff;
            border: none; border-radius: 10px; 
            font-weight: 800; font-size: 16px; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s ease; 
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.7); 
            transform: translateY(-2px);
        }
        .btn-primary:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(255, 0, 0, 0.5); }
        .btn-primary:disabled { background: #333; color: #777; box-shadow: none; transform: none; cursor: not-allowed; }
        
        .btn-outline {
            background: transparent; border: 2px solid #ff0000; color: #ff0000;
            box-shadow: none;
        }
        .btn-outline:hover { background: #ff0000; color: #000; box-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
        
        .switch-form { text-align: center; margin-top: 20px; font-size: 14px; color: #888; }
        .switch-form span { color: #ff0000; cursor: pointer; text-decoration: none; font-weight: 700; transition: color 0.3s; }
        .switch-form span:hover { color: #ff6666; text-decoration: underline; }
        
        .code-input {
            text-align: center; font-size: 36px; letter-spacing: 20px;
            font-weight: 900; color: #ff0000 !important;
            background: rgba(255, 0, 0, 0.05) !important;
            border-color: #ff0000 !important;
        }
        
        /* Профиль */
        .profile-header {
            display: flex; align-items: center; gap: 25px;
            margin-bottom: 30px; border-bottom: 1px solid rgba(255, 0, 0, 0.2); padding-bottom: 25px;
        }
        .avatar {
            width: 90px; height: 90px; 
            background: linear-gradient(135deg, #ff0000, #330000);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 36px; font-weight: 900; 
            box-shadow: 0 0 25px rgba(255,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.5);
            border: 2px solid #ff0000;
            text-shadow: 0 0 10px rgba(255,0,0,0.8);
        }
        .profile-info h3 { border: none; margin-bottom: 5px; font-size: 28px; color: #fff; letter-spacing: 1px; }
        .profile-info .user-id { color: #ff0000; font-weight: 800; font-size: 16px; margin-bottom: 8px; letter-spacing: 1px; }
        .profile-info p { color: #888; font-size: 14px; }
        
        .stats-bar {
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.5);
            padding: 25px; border-radius: 15px; margin-bottom: 30px; 
            border: 1px solid rgba(255, 0, 0, 0.2);
            box-shadow: inset 0 0 20px rgba(255, 0, 0, 0.05);
        }
        .stats-bar div { text-align: center; }
        .stats-bar span { display: block; color: #ff0000; font-size: 26px; font-weight: 900; margin-top: 8px; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        .stats-bar label { color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* Магазин */
        .shop-empty {
            text-align: center; padding: 60px 20px; 
            background: rgba(0,0,0,0.4); border: 1px dashed rgba(255, 0, 0, 0.4);
            border-radius: 15px; color: #888; font-size: 18px; font-weight: 600;
        }
        .shop-empty span { display: block; font-size: 40px; margin-bottom: 15px; }

        /* Модальное окно */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }
        .modal-content {
            background: #111; border: 2px solid #ff0000; border-radius: 20px;
            padding: 40px; width: 100%; max-width: 450px; 
            box-shadow: 0 0 50px rgba(255,0,0,0.4);
        }
        .modal-actions { display: flex; gap: 15px; margin-top: 30px; }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- ТУТ ВАШИ КАРТИНКИ -->
            <!-- Сохраните их как logo_d.png и logo_text.png -->
            <img src="logo_d.png" alt="D" class="header-logo-icon" onerror="this.style.display='none'">
            <img src="logo_text.png" alt="DEXOCLIENT" class="header-logo-text" onerror="this.style.display='none'">
        </div>
        <nav>
            <button id="nav-login" onclick="showAuth('login')">Вход</button>
            <button id="nav-register" onclick="showAuth('register')">Регистрация</button>
            
            <button id="nav-profile" class="hidden" onclick="showSection('profile')">Профиль</button>
            <button id="nav-shop" class="hidden" onclick="showSection('shop')">Магазин</button>
            <button id="nav-logout" class="hidden" onclick="logout()">Выйти</button>
        </nav>
    </header>

    <main>
        <!-- Секция Авторизации -->
        <div id="auth-section" class="container auth-container">
            <!-- Форма входа -->
            <form id="login-form" class="hidden" onsubmit="login(event)">
                <h2>Вход</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn-primary">Войти</button>
                <p class="switch-form">Нет аккаунта? <span onclick="showAuth('register')">Зарегистрироваться</span></p>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" class="hidden" onsubmit="sendCode(event)">
                <h2>Создать профиль</h2>
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" required placeholder="Никнейм">
                </div>
                <div class="form-group">
                    <label>Email (Gmail)</label>
                    <input type="email" id="reg-email" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn-primary" id="send-code-btn">Получить код на почту</button>
                <p class="switch-form">Уже есть аккаунт? <span onclick="showAuth('login')">Войти</span></p>
            </form>

            <!-- Форма ввода кода -->
            <form id="verify-form" class="hidden" onsubmit="verifyCode(event)">
                <h2>Подтверждение</h2>
                <p style="text-align: center; margin-bottom: 20px; color: #aaa;">Мы отправили 6-значный код на <br><b id="code-target-email" style="color:#ff0000"></b></p>
                <div class="form-group">
                    <input type="text" id="verification-input" class="code-input" maxlength="6" placeholder="000000" required>
                </div>
                <button type="submit" class="btn-primary">Подтвердить</button>
                <p class="switch-form"><span onclick="showAuth('register')">← Назад</span></p>
            </form>
        </div>

        <!-- Секция Профиля -->
        <div id="profile-section" class="container hidden">
            <div class="profile-header">
                <div class="avatar" id="profile-avatar">D</div>
                <div class="profile-info">
                    <div class="user-id" id="profile-id">#0000</div>
                    <h3 id="profile-username">Username</h3>
                    <p id="profile-email">email@example.com</p>
                </div>
            </div>
            
            <div class="stats-bar">
                <div>
                    <label>Баланс</label>
                    <span id="profile-balance">500</span>
                </div>
                <div>
                    <label>Статус</label>
                    <span id="profile-status" style="font-size: 20px; margin-top: 12px;">Игрок</span>
                </div>
            </div>
            
            <button class="btn-primary btn-outline" onclick="openSettings()">Настройки профиля</button>
        </div>

        <!-- Секция Магазина -->
        <div id="shop-section" class="container hidden">
            <h2>Магазин DexoClient</h2>
            <div class="stats-bar">
                <div style="width: 100%;">
                    <label>Ваш баланс</label>
                    <span id="shop-balance">0</span>
                </div>
            </div>
            
            <div class="shop-empty">
                <span>🛒</span>
                Товары скоро появятся!
            </div>
        </div>
    </main>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Настройки</h2>
            <div class="form-group">
                <label>Новый никнейм</label>
                <input type="text" id="settings-username">
            </div>
            <div class="form-group">
                <label>Новый пароль (оставьте пустым, чтобы не менять)</label>
                <input type="password" id="settings-password" placeholder="Новый пароль">
            </div>
            <div class="modal-actions">
                <button class="btn-primary btn-outline" onclick="closeSettings()">Отмена</button>
                <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // ============================================
        // ВАШИ КЛЮЧИ EMAILJS
        // ============================================
        const EMAILJS_PUBLIC_KEY = 'RGJCTTeymbxVrIaXB'; 
        const EMAILJS_SERVICE_ID = 'service_9ozbk62'; 
        const EMAILJS_TEMPLATE_ID = 'template_xlmtipr'; 

        emailjs.init(EMAILJS_PUBLIC_KEY);

        // --- База данных (LocalStorage) ---
        let users = JSON.parse(localStorage.getItem('dexo_users')) || [];
        let currentUser = localStorage.getItem('dexo_current');
        let pendingUser = null;
        let generatedCode = null;

        // --- Навигация ---
        function showAuth(type) {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('shop-section').classList.add('hidden');
            
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('verify-form').classList.add('hidden');

            if(type === 'login') document.getElementById('login-form').classList.remove('hidden');
            if(type === 'register') document.getElementById('register-form').classList.remove('hidden');
            if(type === 'verify') document.getElementById('verify-form').classList.remove('hidden');
        }

        function showSection(section) {
            if (!currentUser) return;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('shop-section').classList.add('hidden');

            document.getElementById('nav-profile').classList.remove('active');
            document.getElementById('nav-shop').classList.remove('active');

            if (section === 'profile') {
                document.getElementById('profile-section').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('active');
                updateProfileUI();
            } else if (section === 'shop') {
                document.getElementById('shop-section').classList.remove('hidden');
                document.getElementById('nav-shop').classList.add('active');
                const user = users.find(u => u.email === currentUser);
                document.getElementById('shop-balance').textContent = user.balance;
            }
        }

        // --- Регистрация ---
        function generateCode() { return Math.floor(100000 + Math.random() * 900000).toString(); }

        async function sendCode(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (users.find(u => u.email === email)) { alert('Пользователь с таким Email уже зарегистрирован!'); return; }

            generatedCode = generateCode();
            const uniqueId = Math.floor(1000 + Math.random() * 9000).toString();
            
            pendingUser = { 
                id: uniqueId,
                username, 
                email, 
                password, 
                balance: 500,
                status: 'Игрок'
            };

            const btn = document.getElementById('send-code-btn');
            btn.disabled = true; btn.textContent = 'Отправляем...';

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email, to_name: username, verification_code: generatedCode
                });
                document.getElementById('code-target-email').textContent = email;
                showAuth('verify');
                document.getElementById('verification-input').focus();
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить код. Проверьте настройки EmailJS и правильность email.');
            } finally {
                btn.disabled = false; btn.textContent = 'Получить код на почту';
            }
        }

        function verifyCode(e) {
            e.preventDefault();
            const inputCode = document.getElementById('verification-input').value.trim();
            if (inputCode !== generatedCode) { alert('Неверный код! Попробуйте снова.'); return; }

            users.push(pendingUser);
            localStorage.setItem('dexo_users', JSON.stringify(users));
            alert(`Регистрация успешна! Ваш ID: #${pendingUser.id}\nТеперь войдите в аккаунт.`);
            
            const email = pendingUser.email;
            pendingUser = null; generatedCode = null;
            showAuth('login');
            document.getElementById('login-email').value = email;
            document.getElementById('verification-input').value = '';
            document.getElementById('register-form').reset();
        }

        // --- Вход / Выход ---
        function login(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = email;
                localStorage.setItem('dexo_current', currentUser);
                checkAuthState();
                document.getElementById('login-form').reset();
                showSection('profile');
            } else {
                alert('Неверный Email или пароль!');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('dexo_current');
            checkAuthState();
            showAuth('login');
        }

        // --- Состояние авторизации ---
        function checkAuthState() {
            if (currentUser) {
                document.getElementById('nav-login').classList.add('hidden');
                document.getElementById('nav-register').classList.add('hidden');
                document.getElementById('nav-profile').classList.remove('hidden');
                document.getElementById('nav-shop').classList.remove('hidden');
                document.getElementById('nav-logout').classList.remove('hidden');
                updateProfileUI();
            } else {
                document.getElementById('nav-login').classList.remove('hidden');
                document.getElementById('nav-register').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('hidden');
                document.getElementById('nav-shop').classList.add('hidden');
                document.getElementById('nav-logout').classList.add('hidden');
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('profile-section').classList.add('hidden');
                document.getElementById('shop-section').classList.add('hidden');
            }
        }

        // --- Обновление UI Профиля ---
        function updateProfileUI() {
            const user = users.find(u => u.email === currentUser);
            if (!user) return;

            document.getElementById('profile-username').textContent = user.username;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-avatar').textContent = user.username.charAt(0).toUpperCase();
            document.getElementById('profile-id').textContent = `#${user.id}`;
            document.getElementById('profile-balance').textContent = user.balance;
            document.getElementById('profile-status').textContent = user.status;
        }

        // --- Настройки профиля ---
        function openSettings() {
            const user = users.find(u => u.email === currentUser);
            document.getElementById('settings-username').value = user.username;
            document.getElementById('settings-password').value = '';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const user = users.find(u => u.email === currentUser);
            const newUsername = document.getElementById('settings-username').value.trim();
            const newPassword = document.getElementById('settings-password').value;

            if (newUsername) user.username = newUsername;
            if (newPassword) user.password = newPassword;

            const index = users.findIndex(u => u.email === currentUser);
            users[index] = user;
            localStorage.setItem('dexo_users', JSON.stringify(users));
            
            closeSettings();
            updateProfileUI();
            alert('Настройки сохранены!');
        }

        // --- Старт ---
        window.onload = () => {
            checkAuthState();
            if (!currentUser) showAuth('login');
        };
    </script>
</body>
</html>
