<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DexoClient - Портал</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: #050505; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            /* Новый стильный фон: сетка и красные свечения */
            background-image: 
                linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 20% 50%, rgba(255, 0, 0, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 0, 0.1), transparent 40%);
            background-size: 30px 30px, 30px 30px, 100% 100%, 100% 100%;
        }

        header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 40px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            border-bottom: 2px solid #ff0000; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }
        /* Стили для картинки логотипа */
        .header-logo { 
            height: 45px; 
            filter: drop-shadow(0 0 10px rgba(255,0,0,0.8));
            border-radius: 5px;
        }

        nav button {
            background: transparent; color: #fff; border: 1px solid #ff0000;
            padding: 10px 20px; margin-left: 10px; border-radius: 5px;
            cursor: pointer; font-weight: bold; transition: all 0.3s ease;
            text-transform: uppercase; font-size: 14px;
        }
        nav button:hover, nav button.active { 
            background: #ff0000; box-shadow: 0 0 15px #ff0000; color: #000; 
        }

        main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px; }
        
        .container {
            width: 100%; max-width: 800px; background: rgba(17, 17, 17, 0.95);
            border: 1px solid #330000; border-radius: 15px; padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .auth-container { max-width: 500px; }
        .hidden { display: none !important; }
        
        h2 { text-align: center; margin-bottom: 25px; color: #ff0000; text-transform: uppercase; letter-spacing: 1px; }
        h3 { color: #ff0000; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; background: #050505;
            border: 1px solid #333; border-radius: 5px; color: #fff; outline: none; transition: border 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        
        .btn-primary {
            width: 100%; padding: 12px; background: #ff0000; color: #000;
            border: none; border-radius: 5px; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
        }
        .btn-primary:hover { background: #cc0000; box-shadow: 0 0 20px #ff0000; }
        .btn-primary:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
        .btn-outline {
            background: transparent; border: 1px solid #ff0000; color: #ff0000;
        }
        .btn-outline:hover { background: #ff0000; color: #000; }
        
        .switch-form { text-align: center; margin-top: 15px; font-size: 14px; color: #888; }
        .switch-form span { color: #ff0000; cursor: pointer; text-decoration: underline; }
        
        .code-input {
            text-align: center; font-size: 32px; letter-spacing: 15px;
            font-weight: bold; color: #ff0000 !important;
        }
        
        /* Профиль */
        .profile-header {
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 20px;
        }
        .avatar {
            width: 80px; height: 80px; background: linear-gradient(135deg, #ff0000, #330000);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; box-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        .profile-info h3 { border: none; margin-bottom: 5px; font-size: 24px; color: #fff; }
        .profile-info .user-id { color: #ff0000; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .profile-info p { color: #888; font-size: 14px; }
        .profile-bio { margin-top: 15px; color: #ccc; line-height: 1.6; background: #0a0a0a; padding: 15px; border-radius: 5px; border-left: 3px solid #ff0000; }
        
        .stats-bar {
            display: flex; justify-content: space-between; background: #0a0a0a;
            padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #222;
        }
        .stats-bar div { text-align: center; }
        .stats-bar span { display: block; color: #ff0000; font-size: 20px; font-weight: bold; margin-top: 5px; }
        .stats-bar label { color: #888; font-size: 12px; text-transform: uppercase; }

        /* Магазин */
        .shop-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;
        }
        .shop-item {
            background: #0a0a0a; border: 1px solid #333; border-radius: 10px;
            padding: 20px; text-align: center; transition: all 0.3s;
        }
        .shop-item:hover { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.2); transform: translateY(-5px); }
        .shop-item h4 { color: #fff; margin-bottom: 10px; }
        .shop-item p { color: #888; font-size: 13px; margin-bottom: 15px; min-height: 40px; }
        .shop-item .price { color: #ff0000; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .shop-item button { width: 100%; padding: 10px; font-size: 14px; }

        /* Модальное окно настроек */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111; border: 1px solid #ff0000; border-radius: 10px;
            padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- ТУТ ВАШ ЛОГОТИП -->
            <img src="logo.png" alt="DexoClient Logo" class="header-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="logo-text" style="display:none; font-size: 24px; font-weight: 900; color: #ff0000;">DEXOCLIENT</div>
        </div>
        <nav>
            <button id="nav-login" onclick="showAuth('login')">Вход</button>
            <button id="nav-register" onclick="showAuth('register')">Регистрация</button>
            
            <button id="nav-profile" class="hidden" onclick="showSection('profile')">Профиль</button>
            <button id="nav-shop" class="hidden" onclick="showSection('shop')">Магазин</button>
            <button id="nav-logout" class="hidden" onclick="logout()">Выйти</button>
        </nav>
    </header>

    <main>
        <!-- Секция Авторизации -->
        <div id="auth-section" class="container auth-container">
            <!-- Форма входа -->
            <form id="login-form" class="hidden" onsubmit="login(event)">
                <h2>Вход</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="Введите email">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="login-password" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="btn-primary">Войти</button>
                <p class="switch-form">Нет аккаунта? <span onclick="showAuth('register')">Зарегистрироваться</span></p>
            </form>

            <!-- Форма регистрации -->
            <form id="register-form" class="hidden" onsubmit="sendCode(event)">
                <h2>Создать профиль</h2>
                <div class="form-group">
                    <label>Имя пользователя</label>
                    <input type="text" id="reg-username" required placeholder="Никнейм">
                </div>
                <div class="form-group">
                    <label>Email (Gmail)</label>
                    <input type="email" id="reg-email" required placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" required placeholder="Минимум 6 символов">
                </div>
                <button type="submit" class="btn-primary" id="send-code-btn">Получить код на почту</button>
                <p class="switch-form">Уже есть аккаунт? <span onclick="showAuth('login')">Войти</span></p>
            </form>

            <!-- Форма ввода кода -->
            <form id="verify-form" class="hidden" onsubmit="verifyCode(event)">
                <h2>Подтверждение Email</h2>
                <p style="text-align: center; margin-bottom: 15px; color: #888;">Мы отправили 6-значный код на <br><b id="code-target-email" style="color:#ff0000"></b></p>
                <div class="form-group">
                    <input type="text" id="verification-input" class="code-input" maxlength="6" placeholder="000000" required>
                </div>
                <button type="submit" class="btn-primary">Подтвердить</button>
                <p class="switch-form"><span onclick="showAuth('register')">← Назад</span></p>
            </form>
        </div>

        <!-- Секция Профиля -->
        <div id="profile-section" class="container hidden">
            <div class="profile-header">
                <div class="avatar" id="profile-avatar">D</div>
                <div class="profile-info">
                    <div class="user-id" id="profile-id">#0000</div>
                    <h3 id="profile-username">Username</h3>
                    <p id="profile-email">email@example.com</p>
                </div>
            </div>
            
            <div class="stats-bar">
                <div>
                    <label>Баланс</label>
                    <span id="profile-balance">0</span>
                </div>
                <div>
                    <label>Статус</label>
                    <span id="profile-status" style="font-size: 16px; margin-top: 8px;">Игрок</span>
                </div>
                <div>
                    <label>Инвентарь</label>
                    <span id="profile-inventory" style="font-size: 16px; margin-top: 8px;">Пусто</span>
                </div>
            </div>

            <div class="profile-bio">
                <p><strong>О себе:</strong></p>
                <p id="profile-bio-text">Пользователь пока ничего о себе не рассказал.</p>
            </div>
            
            <button class="btn-primary btn-outline" style="margin-top: 20px;" onclick="openSettings()">Настройки профиля</button>
        </div>

        <!-- Секция Магазина -->
        <div id="shop-section" class="container hidden">
            <h2>Магазин DexoClient</h2>
            <div class="stats-bar">
                <div style="width: 100%;">
                    <label>Ваш баланс</label>
                    <span id="shop-balance">0</span>
                </div>
            </div>
            <div class="shop-grid" id="shop-items-container">
                <!-- Товары генерируются через JS -->
            </div>
        </div>
    </main>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Настройки</h2>
            <div class="form-group">
                <label>Новый никнейм</label>
                <input type="text" id="settings-username">
            </div>
            <div class="form-group">
                <label>Новый пароль (оставьте пустым, чтобы не менять)</label>
                <input type="password" id="settings-password" placeholder="Новый пароль">
            </div>
            <div class="form-group">
                <label>О себе</label>
                <textarea id="settings-bio" rows="3"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-primary btn-outline" onclick="closeSettings()">Отмена</button>
                <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        // ============================================
        // ВАШИ КЛЮЧИ EMAILJS
        // ============================================
        const EMAILJS_PUBLIC_KEY = 'RGJCTTeymbxVrIaXB'; 
        const EMAILJS_SERVICE_ID = 'service_9ozbk62'; 
        const EMAILJS_TEMPLATE_ID = 'template_xlmtipr'; 

        emailjs.init(EMAILJS_PUBLIC_KEY);

        // --- База данных (LocalStorage) ---
        let users = JSON.parse(localStorage.getItem('dexo_users')) || [];
        let currentUser = localStorage.getItem('dexo_current');
        let pendingUser = null;
        let generatedCode = null;

        // --- Игровые предметы для магазина ---
        const shopItems = [
            { id: 'vip', name: 'VIP Статус', desc: 'Особый значок в профиле', price: 500, type: 'status' },
            { id: 'red_nick', name: 'Красный Ник', desc: 'Ваш никнейм станет красным', price: 300, type: 'cosmetic' },
            { id: 'boost', name: 'Буст Профиля', desc: '+100 к крутости', price: 200, type: 'cosmetic' },
            { id: 'custom_id', name: 'Красивый ID', desc: 'Смена ID на 0001', price: 1000, type: 'special' }
        ];

        // --- Навигация ---
        function showAuth(type) {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('shop-section').classList.add('hidden');
            
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('register-form').classList.add('hidden');
            document.getElementById('verify-form').classList.add('hidden');

            if(type === 'login') document.getElementById('login-form').classList.remove('hidden');
            if(type === 'register') document.getElementById('register-form').classList.remove('hidden');
            if(type === 'verify') document.getElementById('verify-form').classList.remove('hidden');
        }

        function showSection(section) {
            if (!currentUser) return;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('profile-section').classList.add('hidden');
            document.getElementById('shop-section').classList.add('hidden');

            // Сброс активных классов на кнопках
            document.getElementById('nav-profile').classList.remove('active');
            document.getElementById('nav-shop').classList.remove('active');

            if (section === 'profile') {
                document.getElementById('profile-section').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('active');
                updateProfileUI();
            } else if (section === 'shop') {
                document.getElementById('shop-section').classList.remove('hidden');
                document.getElementById('nav-shop').classList.add('active');
                renderShop();
            }
        }

        // --- Регистрация ---
        function generateCode() { return Math.floor(100000 + Math.random() * 900000).toString(); }

        async function sendCode(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            if (users.find(u => u.email === email)) { alert('Пользователь с таким Email уже зарегистрирован!'); return; }

            generatedCode = generateCode();
            
            // Генерируем уникальный ID от 1000 до 9999
            const uniqueId = Math.floor(1000 + Math.random() * 9000).toString();
            
            pendingUser = { 
                id: uniqueId,
                username, 
                email, 
                password, 
                bio: '',
                balance: 500, // Стартовый баланс
                inventory: [],
                status: 'Игрок'
            };

            const btn = document.getElementById('send-code-btn');
            btn.disabled = true; btn.textContent = 'Отправляем...';

            try {
                await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email, to_name: username, verification_code: generatedCode
                });
                document.getElementById('code-target-email').textContent = email;
                showAuth('verify');
                document.getElementById('verification-input').focus();
            } catch (error) {
                console.error('Ошибка отправки:', error);
                alert('Не удалось отправить код. Проверьте настройки EmailJS и правильность email.');
            } finally {
                btn.disabled = false; btn.textContent = 'Получить код на почту';
            }
        }

        function verifyCode(e) {
            e.preventDefault();
            const inputCode = document.getElementById('verification-input').value.trim();
            if (inputCode !== generatedCode) { alert('Неверный код! Попробуйте снова.'); return; }

            users.push(pendingUser);
            localStorage.setItem('dexo_users', JSON.stringify(users));
            alert(`Регистрация успешна! Ваш ID: #${pendingUser.id}\nТеперь войдите в аккаунт.`);
            
            const email = pendingUser.email;
            pendingUser = null; generatedCode = null;
            showAuth('login');
            document.getElementById('login-email').value = email;
            document.getElementById('verification-input').value = '';
            document.getElementById('register-form').reset();
        }

        // --- Вход / Выход ---
        function login(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const user = users.find(u => u.email === email && u.password === password);
            if (user) {
                currentUser = email;
                localStorage.setItem('dexo_current', currentUser);
                checkAuthState();
                document.getElementById('login-form').reset();
                showSection('profile'); // Сразу открываем профиль
            } else {
                alert('Неверный Email или пароль!');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('dexo_current');
            checkAuthState();
            showAuth('login');
        }

        // --- Состояние авторизации ---
        function checkAuthState() {
            if (currentUser) {
                document.getElementById('nav-login').classList.add('hidden');
                document.getElementById('nav-register').classList.add('hidden');
                document.getElementById('nav-profile').classList.remove('hidden');
                document.getElementById('nav-shop').classList.remove('hidden');
                document.getElementById('nav-logout').classList.remove('hidden');
                updateProfileUI();
            } else {
                document.getElementById('nav-login').classList.remove('hidden');
                document.getElementById('nav-register').classList.remove('hidden');
                document.getElementById('nav-profile').classList.add('hidden');
                document.getElementById('nav-shop').classList.add('hidden');
                document.getElementById('nav-logout').classList.add('hidden');
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('profile-section').classList.add('hidden');
                document.getElementById('shop-section').classList.add('hidden');
            }
        }

        // --- Обновление UI Профиля ---
        function updateProfileUI() {
            const user = users.find(u => u.email === currentUser);
            if (!user) return;

            document.getElementById('profile-username').textContent = user.username;
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-avatar').textContent = user.username.charAt(0).toUpperCase();
            document.getElementById('profile-id').textContent = `#${user.id}`;
            document.getElementById('profile-balance').textContent = user.balance;
            document.getElementById('profile-status').textContent = user.status;
            document.getElementById('profile-bio-text').textContent = user.bio || 'Пользователь пока ничего о себе не рассказал.';
            
            // Инвентарь
            const invText = user.inventory.length > 0 ? user.inventory.join(', ') : 'Пусто';
            document.getElementById('profile-inventory').textContent = invText;

            // Красим ник, если куплен "Красный Ник"
            const nameEl = document.getElementById('profile-username');
            if (user.inventory.includes('red_nick')) {
                nameEl.style.color = '#ff0000';
                nameEl.style.textShadow = '0 0 10px #ff0000';
            } else {
                nameEl.style.color = '#fff';
                nameEl.style.textShadow = 'none';
            }
        }

        // --- Настройки профиля ---
        function openSettings() {
            const user = users.find(u => u.email === currentUser);
            document.getElementById('settings-username').value = user.username;
            document.getElementById('settings-bio').value = user.bio;
            document.getElementById('settings-password').value = '';
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const user = users.find(u => u.email === currentUser);
            const newUsername = document.getElementById('settings-username').value.trim();
            const newPassword = document.getElementById('settings-password').value;
            const newBio = document.getElementById('settings-bio').value.trim();

            if (newUsername) user.username = newUsername;
            if (newPassword) user.password = newPassword;
            user.bio = newBio;

            // Обновляем в базе
            const index = users.findIndex(u => u.email === currentUser);
            users[index] = user;
            localStorage.setItem('dexo_users', JSON.stringify(users));
            
            closeSettings();
            updateProfileUI();
            alert('Настройки сохранены!');
        }

        // --- Магазин ---
        function renderShop() {
            const user = users.find(u => u.email === currentUser);
            document.getElementById('shop-balance').textContent = user.balance;
            
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';

            shopItems.forEach(item => {
                const isBought = user.inventory.includes(item.id);
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <h4>${item.name}</h4>
                    <p>${item.desc}</p>
                    <div class="price">${item.price} DexoCoins</div>
                    <button class="btn-primary ${isBought ? 'btn-outline' : ''}" 
                            onclick="buyItem('${item.id}', ${item.price})"
                            ${isBought ? 'disabled' : ''}>
                        ${isBought ? 'Куплено' : 'Купить'}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function buyItem(itemId, price) {
            const user = users.find(u => u.email === currentUser);
            
            if (user.balance < price) {
                alert('Недостаточно средств!');
                return;
            }

            if (user.inventory.includes(itemId)) {
                alert('У вас уже есть этот предмет!');
                return;
            }

            // Покупка
            user.balance -= price;
            user.inventory.push(itemId);
            
            // Если куплен VIP
            if (itemId === 'vip') user.status = 'VIP';

            // Сохраняем
            const index = users.findIndex(u => u.email === currentUser);
            users[index] = user;
            localStorage.setItem('dexo_users', JSON.stringify(users));

            alert(`Вы успешно купили предмет!`);
            renderShop(); // Обновляем магазин
            updateProfileUI(); // Обновляем профиль (баланс)
        }

        // --- Старт ---
        window.onload = () => {
            checkAuthState();
            if (!currentUser) showAuth('login');
        };
    </script>
</body>
</html>
